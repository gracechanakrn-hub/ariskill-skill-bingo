# AriSkill Skill Bingo - API contract (provisional names, normative behavior)
version: 1.2.0
basePath: /api/v1
conventions:
  contentType: application/json
  errors:
    shape: { error: { code: string, message: string, exceptionId: "E1..E23|null", details: object|null }, correlationId: string, serverTime: ISO }
    codes:
      UNAUTHORIZED: { http: 401, exception: E9 }
      FORBIDDEN: { http: 403, exception: E9 }
      TOKEN_EXPIRED: { http: 401, exception: E2 }
      NOT_FOUND: { http: 404 }
      VALIDATION: { http: 400 }
      PROFILE_REQUIRED: { http: 409, exception: E16 }
      DUPLICATE_SKILL: { http: 409, exception: E4 }
      ROUND_LOCKED: { http: 409, exception: E8 }
      STALE_VERSION: { http: 409, exception: E10, details: { currentVersion, snapshot } }
      IDEMPOTENCY_MISMATCH: { http: 422, message: "same key, different request" }
      POOL_TOO_SMALL: { http: 409, exception: E20 }
      POOL_EXHAUSTED: { http: 409, exception: E11 }
      REASON_REQUIRED: { http: 400 }
      ILLEGAL_TRANSITION: { http: 409, exception: E10 }
      DRAW_FAILED: { http: 500, exception: E21 }
      FLOAT_FAILED: { http: 409, exception: E13 }
      GREETING_REJECTED: { http: 422, exception: E24 }
      RATE_LIMITED: { http: 429 }
      INTERNAL: { http: 500, message: "unexpected server error; never used on the draw path" }
  idempotency:
    header: Idempotency-Key
    rule: >
      Every mutating operation requires Idempotency-Key. The server stores key, actor, SHA-256 of the
      request body, response, and expiry (24 h). Same key + same hash returns the stored response;
      same key + different hash returns IDEMPOTENCY_MISMATCH.
  versioning:
    rule: Round mutations require expectedVersion; board mutations require boardVersion. Mismatch returns STALE_VERSION and the current snapshot.
  responseEnvelope: every 2xx JSON response includes correlationId, serverTime, and (for mutations) resultingVersion.
  authentication:
    participant: "Authorization: Bearer <sessionToken> (issued by POST /events/{eventId}/session)"
    admin: "Authorization: Bearer <BINGO_ADMIN_TOKEN>"
    stage: "Authorization: Bearer <BINGO_STAGE_TOKEN> (read-only scope)"
    public: none
  rateLimits: { commands: "10/s per actor", session: "5/min per IP", discovery: "20/s per session" }

operations:
  # ---- time / public --------------------------------------------------------
  - id: time.now
    method: GET
    path: /time
    auth: none
    response: { serverTime: ISO, epochMs: int }

  - id: event.snapshot
    method: GET
    path: /events/{eventId}/snapshot
    auth: none
    response: PublicSnapshot   # contracts/projections/public.json

  - id: event.stream
    method: GET
    path: /events/{eventId}/stream
    auth: none
    query: { since: int? }
    response: text/event-stream (public projection)

  - id: event.join_info
    method: GET
    path: /events/{eventId}/join-info
    auth: none
    response: { joinUrl: string, expiresAt: ISO }   # the QR payload shown on the public display; token is short-lived and rotated

  # ---- participant ----------------------------------------------------------
  - id: event.session.create
    method: POST
    path: /events/{eventId}/session
    auth: none
    body: { joinToken: string, employeeRef: string, displayName: string, consentPublicName: bool }
    response: { sessionToken: string, participantId: string, eventId: string, expiresAt: ISO }
    errors: [TOKEN_EXPIRED, VALIDATION]

  - id: me.snapshot
    method: GET
    path: /me
    auth: participant
    response: ParticipantSnapshot   # contracts/projections/participant.json

  - id: me.stream
    method: GET
    path: /me/stream
    auth: participant
    response: text/event-stream (participant projection)

  - id: taxonomy.query
    method: GET
    path: /taxonomy
    auth: participant
    response: { platforms: [{id,name}], roles: [{id,name,platformId}], matrixVersion: string }

  - id: me.profile.set
    method: POST
    path: /me/profile
    auth: participant
    body: { platformId: string, roleId: string }
    rule: Both values must be sent explicitly by the client; the server never derives them from employeeRef.
    response: { participant: ParticipantPublicSelf }

  - id: skill.discovery.query
    method: GET
    path: /skills/discovery
    auth: participant
    query: { mode: "core|role|recommended|popular|search", q: string?, limit: int? }  # core = the 7 Core Skill kind (picker Q1); role = role skills minus core (picker Q2), D-35
    rule: recommended = role's core+critical then optional skills; popular = most selected across the event (falls back to matrix frequency); search = case-insensitive substring across name/domain/cluster.
    response: { mode, skills: [{ id, name, domain, cluster, kind, isCore, isCritical, eligible, roleLevel: "core|critical|optional|null" }], selectedCount: int }
    errors: [PROFILE_REQUIRED]

  - id: board.selections.save
    method: PUT
    path: /me/board/selections
    auth: participant
    headers: [Idempotency-Key]
    body: { skillIds: string[], boardVersion: int }
    rule: >
      Replaces the draft selection set. Max 16, all unique, all active. Duplicates in the list -> DUPLICATE_SKILL.
      If the participant already holds a board in the current round and that round is locked -> ROUND_LOCKED (E8) with no mutation.
      Late joiner (no board in the current round while it is LOCKED/PLAYING/WINNER/EXHAUSTED): the selections are persisted as a
      DEFERRED board (reason `late`, no positions) on that round, the response is 200 with `notice` { kind:'late', exceptionId:'E8', text },
      board.deferred {reason:'late'} is emitted, and the board is reassigned when the next round opens (BR-06, contract 1.0.2).
      A READY board whose set changes returns to DRAFT and its positions are cleared (D-12).
    response: { board: ParticipantBoard, resultingVersion: int, notice?: { kind: 'late', exceptionId: 'E8', text: string } }
    errors: [PROFILE_REQUIRED, DUPLICATE_SKILL, ROUND_LOCKED (E8; or E1 when no round can accept a board), STALE_VERSION, VALIDATION]

  - id: board.finalize
    method: POST
    path: /me/board/finalize
    auth: participant
    headers: [Idempotency-Key]
    body: { boardVersion: int }
    rule: Requires exactly 16 unique selections; server shuffles positions; snapshots matrixVersion; state READY. Client-supplied positions are ignored (none accepted in body).
    response: { board: ParticipantBoard, resultingVersion: int }
    errors: [VALIDATION (E18 on persistence failure), ROUND_LOCKED, STALE_VERSION]

  - id: me.insight
    method: GET
    path: /me/insight
    auth: participant
    rule: Available once the participant's board is FINISHED. Private only.
    response: { roundId, matrixVersion, inMatrixCount: int, beyondMatrixCount: int, totalSelected: 16 }

  - id: soul.float
    method: POST
    path: /me/soul/float
    auth: participant
    headers: [Idempotency-Key]
    body: { soulId: string, floatToken: string, greeting: string? }   # greeting (D-42): optional, checked before the token is used; see packages/game-rules/src/greeting.js; rejected -> GREETING_REJECTED (E24, details.reason too-long|link|contact|handle|language)
    rule: >
      Atomic one-use consumption. A repeat with the same token returns the original entrance (accepted=true, replay=true). Expired/unknown token -> FLOAT_FAILED (E13).
      entrance.config is the Soul's stored config, the same one the public and stage screens get (realtime-events.json shapes):
      SoulConfig v3 { version: 3, catalog, seed, gradient, glow, face, plate, eyes, charms, topper, constellation, driftPhase }
      for Souls created from contract 1.2.0 on (D-31: face plate, eyes and antenna charm, all picked from the seed);
      SoulConfigV2 (face, charms, gradient) for Souls created under 1.1.0 (D-29) and for the neutral fallback; SoulConfigV1 before 1.1.0.
    response: { accepted: true, replay: bool, entrance: SoulEntrance }

  # ---- admin ----------------------------------------------------------------
  - id: round.admin.snapshot
    method: GET
    path: /admin/events/{eventId}/snapshot
    auth: admin
    response: AdminSnapshot   # contracts/projections/admin.json

  - id: admin.stream
    method: GET
    path: /admin/events/{eventId}/stream
    auth: admin
    response: text/event-stream (admin projection)

  - id: round.create
    method: POST
    path: /admin/events/{eventId}/rounds
    auth: admin
    headers: [Idempotency-Key]
    body: { title: string, lockAt: ISO, resultWindowSeconds: int? }
    response: { round: RoundSummary, resultingVersion: int }

  - id: round.command
    method: POST
    path: /admin/rounds/{roundId}/commands
    auth: admin
    headers: [Idempotency-Key]
    body:
      command: "round.update|round.registration.open|round.reschedule|round.lock|round.start|round.start_now|round.draw.next|round.cancel|round.close"
      expectedVersion: int
      params:
        round.update / round.reschedule: { title?: string, lockAt?: ISO, resultWindowSeconds?: int }
        round.start_now: { confirmed: true }
        round.cancel: { reason: string }
        round.draw.next: {}   # never contains a skill identifier
    rule: >
      Pending/accepted/rejected semantics: the client shows pending until the response arrives; on network
      loss it retries with the same Idempotency-Key. Rejections never mutate the round.
    response: { accepted: true, round: RoundSummary, resultingVersion: int, effects: { draw?: Draw, winners?: WinnerAdmin[], activeBoards?: int, deferredBoards?: int } }
    errors: [STALE_VERSION, ILLEGAL_TRANSITION, POOL_TOO_SMALL, POOL_EXHAUSTED, REASON_REQUIRED, DRAW_FAILED, VALIDATION]

  - id: admin.insights
    method: GET
    path: /admin/events/{eventId}/insights
    auth: admin
    response: Insights   # contracts/projections/insights.json (aggregate only; cohort suppression D-15)

  - id: admin.audit
    method: GET
    path: /admin/events/{eventId}/audit
    auth: admin
    query: { roundId: string?, limit: int? }
    response: { entries: [{ id, at, actor, action, target, expectedVersion, actualVersion, outcome, correlationId, details }] }

  - id: admin.join_link
    method: GET
    path: /admin/events/{eventId}/join-link
    auth: admin
    response: { joinUrl: string, expiresAt: ISO }

  # ---- stage ----------------------------------------------------------------
  - id: round.stage.snapshot
    method: GET
    path: /stage/events/{eventId}/snapshot
    auth: stage
    response: StageSnapshot   # contracts/projections/stage.json

  - id: stage.stream
    method: GET
    path: /stage/events/{eventId}/stream
    auth: stage
    response: text/event-stream (stage projection)

staticApps:
  employee-mobile: { path: "/play", entry: apps/employee-mobile/index.html, joinParam: "t" }
  admin-portal: { path: "/admin", entry: apps/admin-portal/index.html }
  public-galaxy: { path: "/public", entry: apps/public-galaxy/index.html }
  stage-dashboard: { path: "/stage", entry: apps/stage-dashboard/index.html }
  shared: { path: "/packages/*", "/assets/*", "/tokens/*", "/contracts/*" }
